paths:
  /api/v1/rpc:
    post:
      summary: SkeinQL RPC endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RpcRequest"
      responses:
        "200":
          description: SkeinQL response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
  /api/v1/q/{query_id}:
    get:
      summary: Execute a prepared query by id (optional)
      parameters:
        - name: query_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
  /api/v1/cdc/sse/{sub_id}:
    get:
      summary: Stream CDC events via text/event-stream (optional)
      parameters:
        - name: sub_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    RpcRequest:
      type: object
      required: [skeinql, method]
      properties:
        skeinql:
          type: string
          example: "1.0"
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
        params:
          type: object
          nullable: true
    RpcResponse:
      type: object
      required: [ok]
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        ok:
          type: boolean
        result:
          type: object
          nullable: true
        error:
          $ref: "#/components/schemas/RpcError"
    RpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
