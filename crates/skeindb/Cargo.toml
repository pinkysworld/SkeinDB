[package]
name = "skeindb"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server + SkeinQL RPC
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
sysinfo = "0.30"
quinn = "0.10"
rustls = "0.21"
rustls-pemfile = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

regex = "1"

skeindb-core = { path = "../skeindb-core" }
skeindb-ir = { path = "../skeindb-ir" }
skeindb-skeinql = { path = "../skeindb-skeinql" }

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.11"
