[package]
name = "skeindb"
version = "0.3.19"
edition = "2021"
license = "Apache-2.0"
description = "Single-binary database server with SkeinQL, SkeinAdmin, MySQL, and early PostgreSQL surfaces"
homepage = "https://github.com/pinkysworld/SkeinDB"
repository = "https://github.com/pinkysworld/SkeinDB"
readme = "../../README.md"
keywords = ["database", "mysql", "postgresql", "json-rpc", "admin-ui"]
categories = ["database", "command-line-utilities", "web-programming::http-server"]

[package.metadata.deb]
maintainer = "pinkysworld <85413447+pinkysworld@users.noreply.github.com>"
copyright = "2026, Michél Nguyen"
license-file = ["../../LICENSE", "0"]
depends = "$auto"
section = "database"
priority = "optional"
assets = [
	["target/release/skeindb", "usr/bin/skeindb", "755"],
	["../../README.md", "usr/share/doc/skeindb/README.md", "644"],
	["../../LICENSE", "usr/share/doc/skeindb/LICENSE", "644"],
]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server + SkeinQL RPC
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
sysinfo = "0.30"
quinn = { package = "anza-quinn", version = "0.11.9-rustsec20260037" }
rustls = "0.23"
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
wasmtime = { version = "43.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "1"

regex = "1"

skeindb-core = { path = "../skeindb-core" }
skeindb-ir = { path = "../skeindb-ir" }
skeindb-skeinql = { path = "../skeindb-skeinql" }

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.14"
tokio-tungstenite = "0.24"
