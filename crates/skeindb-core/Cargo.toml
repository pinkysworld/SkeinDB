[package]
name = "skeindb-core"
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"

[dependencies]
aes-gcm-siv = "0.11"
blake3 = "1"
crc32c = "0.6"
getrandom = "0.2"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
wasmtime = "20"

[dev-dependencies]
wat = "1"
