[package]
name = "skeindb-core"
version = "0.3.21"
edition = "2021"
license = "Apache-2.0"

[dependencies]
aes-gcm-siv = "0.11"
blake3 = "1"
crc32c = "0.6"
getrandom = "0.4"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
wasmtime = { version = "45.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
zstd = "0.13"

[dev-dependencies]
wat = "1"
