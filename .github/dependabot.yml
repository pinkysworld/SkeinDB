version: 2
updates:
  # Rust dependencies.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      rustcrypto-compat:
        patterns:
          - "aes-gcm-siv"
          - "block-buffer"
          - "crypto-common"
          - "digest"
          - "getrandom"
          - "hkdf"
          - "hmac"
          - "md-5"
          - "sha1"
          - "sha2"
        update-types:
          - minor
          - patch
      web-stack:
        patterns:
          - "axum"
          - "axum-core"
          - "matchit"
          - "tokio-tungstenite"
          - "tower-http"
          - "tungstenite"
        update-types:
          - minor
          - patch
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Playwright e2e tooling.
  - package-ecosystem: npm
    directory: "/tests/playwright"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
