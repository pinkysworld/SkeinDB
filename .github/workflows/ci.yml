name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      - name: Wire-protocol fuzz harness
        run: cargo test -p skeindb --bins protocol_parsers_never_panic_on_fuzz_input -- --nocapture

  playwright:
    name: SkeinAdmin e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pw-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build skeindb binary
        run: cargo build -p skeindb --bin skeindb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SkeinQL Node SDK example tests
        run: node --test examples/sdk/node/

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests/playwright
        env:
          SKEINDB_BIN: ${{ github.workspace }}/target/debug/skeindb
          CI: '1'
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs site generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: python -m pip install --upgrade markdown Pygments

      - name: Build documentation site
        run: python scripts/build_docs_site.py

      - name: SkeinQL Python SDK example tests
        run: python -m unittest discover -s examples/sdk/python

      - name: Benchmark report generator tests
        run: python -m unittest discover -s eval -p 'test_*.py'
