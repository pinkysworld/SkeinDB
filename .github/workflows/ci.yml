name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      - name: Wire-protocol fuzz harness
        run: cargo test -p skeindb --bins protocol_parsers_never_panic_on_fuzz_input -- --nocapture

      - name: R18 replay regression comparator gate
        run: |
          cargo run -p skeindb -- replay compare \
            --baseline tests/fixtures/replay/r18-baseline.json \
            --candidate tests/fixtures/replay/r18-candidate.json \
            --max-p95-delta-ms 3 \
            --max-p99-delta-ms 4 \
            --max-span-delta-ms 3 \
            --max-disk-bytes-delta 2048 \
            --max-missing-hot-tables-delta 1 \
            --out target/r18-replay-comparison.json

      - name: Upload R18 replay comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r18-replay-comparison
          path: target/r18-replay-comparison.json
          if-no-files-found: ignore
          retention-days: 14


  r18-cross-revision:
    name: R18 base vs head replay
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-r18-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-r18-
            ${{ runner.os }}-cargo-

      - name: Run same replay bundle on base and head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/r18_cross_revision_ci.sh

      - name: Upload R18 cross-revision evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r18-cross-revision
          path: target/r18-cross-revision
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: SkeinAdmin e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pw-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build skeindb binary
        run: cargo build -p skeindb --bin skeindb

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: SkeinQL Node SDK example tests
        run: node --test examples/sdk/node/

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests/playwright
        env:
          SKEINDB_BIN: ${{ github.workspace }}/target/debug/skeindb
          CI: '1'
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs site generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: python -m pip install --upgrade markdown Pygments

      - name: Build documentation site
        run: python scripts/build_docs_site.py

      - name: SkeinQL Python SDK example tests
        run: python -m unittest discover -s examples/sdk/python

      - name: Benchmark report generator tests
        run: python -m unittest discover -s eval -p 'test_*.py'

      - name: Reproduce redundancy pipeline report
        run: |
          python eval/redundancy_pipeline.py \
            --rows 600 \
            --seed 20260922 \
            --json-out /tmp/redundancy_pipeline_default.json \
            --markdown-out /tmp/redundancy_pipeline_default.md
          diff -u eval/reports/redundancy_pipeline_default.json /tmp/redundancy_pipeline_default.json
          diff -u eval/reports/redundancy_pipeline_default.md /tmp/redundancy_pipeline_default.md


  redundancy-runtime:
    name: Live redundancy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and runtime build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-redundancy-runtime-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build SkeinDB
        run: cargo build -p skeindb --bin skeindb

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run live redundancy validation
        run: |
          python eval/runtime_redundancy_validation.py \
            --skeindb-bin target/debug/skeindb \
            --rows 300 \
            --seed 20260922 \
            --json-out target/redundancy-runtime/report.json \
            --markdown-out target/redundancy-runtime/report.md \
            --log-dir target/redundancy-runtime/logs

      - name: Verify live redundancy snapshot
        run: diff -u eval/reports/redundancy_runtime_ci.md target/redundancy-runtime/report.md

      - name: Run two-node CAS validation unit tests
        env:
          PYTHONPATH: eval
        run: |
          python -m unittest \
            eval.test_runtime_redundancy_validation \
            eval.test_two_node_cas_validation

      - name: Run two-node CAS transfer validation
        run: |
          python eval/two_node_cas_validation.py \
            --skeindb-bin target/debug/skeindb \
            --rows 300 \
            --seed 20260922 \
            --batch-size 32 \
            --json-out target/redundancy-runtime/cas-two-node.json \
            --markdown-out target/redundancy-runtime/cas-two-node.md \
            --log-dir target/redundancy-runtime/cas-two-node-logs

      - name: Verify two-node CAS snapshot
        run: diff -u eval/reports/cas_two_node_ci.md target/redundancy-runtime/cas-two-node.md

      - name: Run HTTP wire validation unit tests
        env:
          PYTHONPATH: eval
        run: |
          python -m unittest \
            eval.test_two_node_http_wire_validation

      - name: Run two-node CAS HTTP wire validation
        run: |
          python eval/two_node_http_wire_validation.py \
            --skeindb-bin target/debug/skeindb \
            --rows 300 \
            --seed 20260922 \
            --batch-size 32 \
            --json-out target/redundancy-runtime/cas-http-wire.json \
            --markdown-out target/redundancy-runtime/cas-http-wire.md \
            --log-dir target/redundancy-runtime/cas-http-wire-logs

      - name: Upload live redundancy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redundancy-runtime
          path: target/redundancy-runtime
          if-no-files-found: error
          retention-days: 14

  driver-smoke:
    name: Real-driver smoke matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build skeindb binary
        run: cargo build -p skeindb --bin skeindb

      - name: Install PostgreSQL and MySQL command-line clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client default-mysql-client

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Node smoke drivers
        working-directory: tests/smoke
        run: npm ci || npm install

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python smoke drivers
        run: python -m pip install -r tests/smoke/requirements.txt

      - name: Run driver smoke matrix
        env:
          SKEINDB_BIN: ${{ github.workspace }}/target/debug/skeindb
          SKEINDB_SMOKE_STRICT: '1'
        run: bash tests/smoke/run_smoke.sh
