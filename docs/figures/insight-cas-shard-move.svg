<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">SkeinDB shard move progress surface</title>
  <desc id="desc">A stylized screenshot showing a manifest-backed shard move with object counts, missing bytes, and transfer progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#10192e"/>
    </linearGradient>
    <linearGradient id="panel" x1="40" y1="40" x2="1240" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c90ff"/>
      <stop offset="1" stop-color="#33d6ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#030712" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="840" fill="url(#bg)"/>
  <circle cx="1090" cy="120" r="180" fill="#3157ff" fill-opacity="0.10"/>
  <circle cx="170" cy="710" r="220" fill="#13b5c8" fill-opacity="0.08"/>

  <rect x="40" y="40" width="1200" height="760" rx="30" fill="url(#panel)" stroke="#26304a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="76" y="76" width="1128" height="58" rx="18" fill="#10182b" stroke="#293554"/>
  <circle cx="106" cy="105" r="7" fill="#f97316"/>
  <circle cx="132" cy="105" r="7" fill="#facc15"/>
  <circle cx="158" cy="105" r="7" fill="#22c55e"/>
  <text x="192" y="111" fill="#dbe5ff" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">cluster.shard.move</text>
  <text x="1015" y="111" fill="#7c90ff" font-size="18" font-family="JetBrains Mono, monospace">stage: completed</text>

  <rect x="76" y="168" width="420" height="596" rx="24" fill="#0d1424" stroke="#26304a"/>
  <text x="108" y="212" fill="#7c90ff" font-size="18" font-family="JetBrains Mono, monospace">transfer flow</text>
  <text x="108" y="245" fill="#f8fafc" font-size="38" font-family="Inter, Arial, sans-serif" font-weight="800">Shard users -&gt; replica-a</text>
  <text x="108" y="280" fill="#95a4c7" font-size="20" font-family="Inter, Arial, sans-serif">Manifest totals, destination need-check, then objects.pull before placement changes.</text>

  <rect x="108" y="328" width="356" height="88" rx="20" fill="#121c30" stroke="#31415f"/>
  <text x="132" y="360" fill="#7dd3fc" font-size="17" font-family="JetBrains Mono, monospace">source primary</text>
  <text x="132" y="389" fill="#f8fafc" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">node-test</text>
  <text x="314" y="389" fill="#93c5fd" font-size="18" font-family="JetBrains Mono, monospace">/api/v1/rpc</text>

  <path d="M286 416 L286 460" stroke="#4f5f87" stroke-width="3" stroke-linecap="round"/>
  <path d="M286 460 L300 446" stroke="#4f5f87" stroke-width="3" stroke-linecap="round"/>
  <path d="M286 460 L272 446" stroke="#4f5f87" stroke-width="3" stroke-linecap="round"/>

  <rect x="108" y="484" width="356" height="120" rx="20" fill="#10192d" stroke="#31415f"/>
  <text x="132" y="517" fill="#f59e0b" font-size="17" font-family="JetBrains Mono, monospace">manifest</text>
  <text x="132" y="549" fill="#f8fafc" font-size="46" font-family="Inter, Arial, sans-serif" font-weight="800">3 objects</text>
  <text x="132" y="579" fill="#95a4c7" font-size="20" font-family="Inter, Arial, sans-serif">152 bytes total, 152 bytes missing</text>

  <rect x="108" y="632" width="170" height="92" rx="18" fill="#102334" stroke="#30506a"/>
  <text x="132" y="664" fill="#67e8f9" font-size="15" font-family="JetBrains Mono, monospace">objects.need</text>
  <text x="132" y="699" fill="#e0f2fe" font-size="26" font-family="Inter, Arial, sans-serif" font-weight="700">missing = 3</text>

  <rect x="294" y="632" width="170" height="92" rx="18" fill="#11251e" stroke="#2d5d4a"/>
  <text x="318" y="664" fill="#34d399" font-size="15" font-family="JetBrains Mono, monospace">objects.pull</text>
  <text x="318" y="699" fill="#ecfdf5" font-size="26" font-family="Inter, Arial, sans-serif" font-weight="700">stored = 3</text>

  <rect x="528" y="168" width="676" height="596" rx="24" fill="#0d1424" stroke="#26304a"/>
  <text x="560" y="212" fill="#7c90ff" font-size="18" font-family="JetBrains Mono, monospace">response snapshot</text>

  <rect x="560" y="244" width="612" height="264" rx="20" fill="#0a1020" stroke="#23314f"/>
  <text x="592" y="286" fill="#67e8f9" font-size="18" font-family="JetBrains Mono, monospace">manifest</text>
  <text x="592" y="324" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">object_count: 3</text>
  <text x="592" y="356" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">total_bytes: 152</text>
  <text x="592" y="388" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">missing_object_count: 3</text>
  <text x="592" y="420" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">missing_bytes: 152</text>
  <text x="592" y="452" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">already_present_object_count: 0</text>

  <rect x="560" y="540" width="290" height="188" rx="20" fill="#0d1830" stroke="#28436e"/>
  <text x="592" y="580" fill="#93c5fd" font-size="16" font-family="JetBrains Mono, monospace">progress</text>
  <text x="592" y="620" fill="#f8fafc" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">requested = 3</text>
  <text x="592" y="654" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">batches: 1</text>
  <text x="592" y="686" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">pulled: 3</text>
  <text x="592" y="718" fill="#dbe5ff" font-size="22" font-family="JetBrains Mono, monospace">stored: 3</text>

  <rect x="882" y="540" width="290" height="188" rx="20" fill="#101d19" stroke="#24463b"/>
  <text x="914" y="580" fill="#6ee7b7" font-size="16" font-family="JetBrains Mono, monospace">safety gate</text>
  <text x="914" y="620" fill="#f0fdf4" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">placement change</text>
  <text x="914" y="654" fill="#d1fae5" font-size="22" font-family="JetBrains Mono, monospace">after pull success</text>
  <text x="914" y="686" fill="#d1fae5" font-size="22" font-family="JetBrains Mono, monospace">verification_failed: []</text>
  <text x="914" y="718" fill="#d1fae5" font-size="22" font-family="JetBrains Mono, monospace">remote_missing: []</text>

  <rect x="915" y="245" width="225" height="110" rx="20" fill="#101b34" stroke="#2e4472"/>
  <text x="945" y="286" fill="#8b9bff" font-size="16" font-family="JetBrains Mono, monospace">destination</text>
  <text x="945" y="322" fill="#f8fafc" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="800">replica-a</text>
  <rect x="945" y="337" width="165" height="10" rx="5" fill="#17355a"/>
  <rect x="945" y="337" width="165" height="10" rx="5" fill="url(#green)"/>
  <text x="945" y="382" fill="#95a4c7" font-size="18" font-family="Inter, Arial, sans-serif">manifest hit-rate becomes visible per move</text>
</svg>