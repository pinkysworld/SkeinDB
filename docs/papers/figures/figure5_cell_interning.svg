<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gIn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="gCell" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="gVer" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="gDup" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#db2777"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".08"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker>
  </defs>

  <rect width="900" height="420" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Figure 5. Cell-Interned MVCC: Content-Addressed Storage with Deduplication</text>

  <!-- INPUT: Row Data -->
  <rect x="30" y="55" width="200" height="140" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="5,3"/>
  <text x="130" y="75" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">Incoming Row Write</text>

  <rect x="45" y="88" width="170" height="22" rx="4" fill="url(#gIn)" filter="url(#sh)"/>
  <text x="55" y="103" font-size="9" fill="#fff" font-weight="600">col_a = "hello"</text>
  <rect x="45" y="116" width="170" height="22" rx="4" fill="url(#gIn)" filter="url(#sh)"/>
  <text x="55" y="131" font-size="9" fill="#fff" font-weight="600">col_b = 42</text>
  <rect x="45" y="144" width="170" height="22" rx="4" fill="url(#gIn)" filter="url(#sh)"/>
  <text x="55" y="159" font-size="9" fill="#fff" font-weight="600">col_c = "hello"</text>
  <text x="130" y="182" text-anchor="middle" font-size="7" fill="#64748b" font-style="italic">col_a and col_c identical</text>

  <!-- STEP 1: Hash -->
  <line x1="230" y1="125" x2="295" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="262" y="118" text-anchor="middle" font-size="8" fill="#475569" font-weight="600">hash</text>

  <!-- CELL STORE -->
  <rect x="300" y="50" width="270" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="435" y="72" text-anchor="middle" font-size="11" fill="#166534" font-weight="700">Cell Store (content-addressed)</text>

  <rect x="315" y="85" width="240" height="34" rx="5" fill="url(#gCell)" filter="url(#sh)"/>
  <text x="325" y="100" font-size="8" fill="#fff" font-weight="700">VID-a1b2</text>
  <text x="400" y="100" font-size="8" fill="#d1fae5">= "hello"</text>
  <text x="325" y="113" font-size="7" fill="#d1fae5">SHA-256: a1b2c3d4…  ·  refcount: 2</text>

  <rect x="315" y="125" width="240" height="34" rx="5" fill="url(#gCell)" filter="url(#sh)"/>
  <text x="325" y="140" font-size="8" fill="#fff" font-weight="700">VID-e5f6</text>
  <text x="400" y="140" font-size="8" fill="#d1fae5">= 42</text>
  <text x="325" y="153" font-size="7" fill="#d1fae5">SHA-256: e5f67890…  ·  refcount: 1</text>

  <rect x="315" y="170" width="240" height="34" rx="5" fill="#fff" stroke="#86efac" stroke-dasharray="4,2"/>
  <text x="325" y="185" font-size="8" fill="#166534" font-weight="700">VID-a1b2</text>
  <text x="400" y="185" font-size="8" fill="#64748b">← deduplicated!</text>
  <text x="325" y="198" font-size="7" fill="#64748b">col_c points to same VID as col_a</text>

  <!-- Dedup arrow -->
  <path d="M435,170 Q435,165 435,159" fill="none" stroke="#db2777" stroke-width="1.5" marker-end="url(#ap)" stroke-dasharray="4,2"/>
  <text x="500" y="168" font-size="7" fill="#db2777" font-weight="600">dedup: same content → same VID</text>

  <!-- STEP 2: Version Chain -->
  <line x1="570" y1="125" x2="615" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- VERSION CHAIN -->
  <rect x="620" y="50" width="250" height="200" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="745" y="72" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">Version Chain</text>

  <rect x="635" y="85" width="220" height="44" rx="5" fill="url(#gVer)" filter="url(#sh)"/>
  <text x="645" y="100" font-size="8" fill="#fff" font-weight="700">Version v3 (current)</text>
  <text x="645" y="113" font-size="7" fill="#fef3c7">txn=T42 · ts=2026-01-15 · [VID-a1b2, VID-e5f6, VID-a1b2]</text>
  <text x="645" y="123" font-size="6.5" fill="#fef3c7">visible to: txn ≥ T42</text>

  <rect x="635" y="138" width="220" height="38" rx="5" fill="#fff" stroke="#fcd34d" filter="url(#sh)"/>
  <text x="645" y="153" font-size="8" fill="#92400e" font-weight="700">Version v2</text>
  <text x="645" y="165" font-size="7" fill="#a16207">txn=T30 · [VID-a1b2, VID-7c8d, VID-9e0f]</text>
  <text x="645" y="173" font-size="6.5" fill="#a16207">visible to: T30 ≤ txn &lt; T42</text>

  <rect x="635" y="185" width="220" height="38" rx="5" fill="#fff" stroke="#fcd34d" filter="url(#sh)"/>
  <text x="645" y="200" font-size="8" fill="#92400e" font-weight="700">Version v1</text>
  <text x="645" y="212" font-size="7" fill="#a16207">txn=T10 · [VID-0a1b, VID-2c3d, VID-4e5f]</text>
  <text x="645" y="220" font-size="6.5" fill="#a16207">visible to: T10 ≤ txn &lt; T30</text>

  <!-- Arrow v3→v2 -->
  <line x1="700" y1="129" x2="700" y2="135" stroke="#d97706" stroke-width="1"/>
  <!-- Arrow v2→v1 -->
  <line x1="700" y1="176" x2="700" y2="182" stroke="#d97706" stroke-width="1"/>

  <!-- BOTTOM: Benefits -->
  <rect x="30" y="275" width="840" height="130" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="700">Cell-Interned MVCC Key Properties</text>

  <!-- Benefit 1 -->
  <rect x="50" y="312" width="190" height="76" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="145" y="332" text-anchor="middle" font-size="9" fill="#166534" font-weight="700">Automatic Dedup</text>
  <text x="60" y="348" font-size="7.5" fill="#475569">Identical values across rows,</text>
  <text x="60" y="360" font-size="7.5" fill="#475569">columns, and versions share</text>
  <text x="60" y="372" font-size="7.5" fill="#475569">one physical cell (refcounted).</text>

  <!-- Benefit 2 -->
  <rect x="255" y="312" width="190" height="76" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="350" y="332" text-anchor="middle" font-size="9" fill="#92400e" font-weight="700">Snapshot Isolation</text>
  <text x="265" y="348" font-size="7.5" fill="#475569">Version chains provide MVCC</text>
  <text x="265" y="360" font-size="7.5" fill="#475569">reads at any past txn boundary.</text>
  <text x="265" y="372" font-size="7.5" fill="#475569">No read-write blocking.</text>

  <!-- Benefit 3 -->
  <rect x="460" y="312" width="190" height="76" rx="6" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="555" y="332" text-anchor="middle" font-size="9" fill="#9d174d" font-weight="700">Delta Chain Ready</text>
  <text x="470" y="348" font-size="7.5" fill="#475569">Content addressing enables</text>
  <text x="470" y="360" font-size="7.5" fill="#475569">structural delta computation</text>
  <text x="470" y="372" font-size="7.5" fill="#475569">between version VID lists (R03).</text>

  <!-- Benefit 4 -->
  <rect x="665" y="312" width="190" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="760" y="332" text-anchor="middle" font-size="9" fill="#1e40af" font-weight="700">Forensic Verifiable</text>
  <text x="675" y="348" font-size="7.5" fill="#475569">Content-addressed VIDs give</text>
  <text x="675" y="360" font-size="7.5" fill="#475569">independent integrity check</text>
  <text x="675" y="372" font-size="7.5" fill="#475569">alongside WAL hash chain (R06).</text>
</svg>
