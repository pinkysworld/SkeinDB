<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gGen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="gOps" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="gRes" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="gTool" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="gFam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".08"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="960" height="620" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Figure 3. SkeinAdmin Panel → Method Family Mapping (19 Panels → 15 Families)</text>

  <!-- LEFT COLUMN: Panels grouped -->
  <!-- General Operations -->
  <text x="20" y="60" font-size="9" fill="#4f46e5" font-weight="700" letter-spacing="1">GENERAL OPERATIONS (7)</text>
  <rect x="20" y="68" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="85" font-size="9" fill="#fff" font-weight="600">1. Overview</text>
  <rect x="20" y="100" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="117" font-size="9" fill="#fff" font-weight="600">2. Console / SQL</text>
  <rect x="20" y="132" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="149" font-size="9" fill="#fff" font-weight="600">3. Schema</text>
  <rect x="20" y="164" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="181" font-size="9" fill="#fff" font-weight="600">4. Data</text>
  <rect x="20" y="196" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="213" font-size="9" fill="#fff" font-weight="600">5. Cluster</text>
  <rect x="20" y="228" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="245" font-size="9" fill="#fff" font-weight="600">6. Settings</text>
  <rect x="20" y="260" width="175" height="26" rx="5" fill="url(#gGen)" filter="url(#sh)"/>
  <text x="30" y="277" font-size="9" fill="#fff" font-weight="600">7. Users &amp; Grants</text>

  <!-- Operations -->
  <text x="20" y="310" font-size="9" fill="#d97706" font-weight="700" letter-spacing="1">OPERATIONS (1)</text>
  <rect x="20" y="318" width="175" height="26" rx="5" fill="url(#gOps)" filter="url(#sh)"/>
  <text x="30" y="335" font-size="9" fill="#fff" font-weight="600">8. Import / Export</text>

  <!-- Research -->
  <text x="20" y="368" font-size="9" fill="#059669" font-weight="700" letter-spacing="1">RESEARCH (9)</text>
  <rect x="20" y="376" width="175" height="26" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="30" y="393" font-size="9" fill="#fff" font-weight="600">9. Research Dashboard</text>
  <rect x="20" y="408" width="175" height="26" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="30" y="425" font-size="9" fill="#fff" font-weight="600">10. Vectors</text>
  <rect x="20" y="440" width="175" height="26" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="30" y="457" font-size="9" fill="#fff" font-weight="600">11. Privacy &amp; DP</text>
  <rect x="20" y="472" width="175" height="26" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="30" y="489" font-size="9" fill="#fff" font-weight="600">12. Forensics</text>
  <rect x="20" y="504" width="175" height="26" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="30" y="521" font-size="9" fill="#fff" font-weight="600">13. Views</text>
  <rect x="20" y="536" width="110" height="11" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="23" y="545" font-size="7.5" fill="#fff" font-weight="600">14. Merge &amp; CRDT</text>
  <rect x="135" y="536" width="60" height="11" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="138" y="545" font-size="6" fill="#fff" font-weight="600">15. Wasm</text>
  <rect x="20" y="552" width="85" height="11" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="23" y="561" font-size="6" fill="#fff" font-weight="600">16. Index Advisor</text>
  <rect x="110" y="552" width="85" height="11" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="113" y="561" font-size="6" fill="#fff" font-weight="600">17. Migration</text>
  <rect x="20" y="568" width="175" height="11" rx="5" fill="url(#gRes)" filter="url(#sh)"/>
  <text x="23" y="577" font-size="6" fill="#fff" font-weight="600">18. NL Lab</text>

  <!-- Tools -->
  <text x="20" y="600" font-size="9" fill="#dc2626" font-weight="700" letter-spacing="1">TOOLS (1)</text>
  <rect x="20" y="604" width="175" height="11" rx="3" fill="url(#gTool)" filter="url(#sh)"/>
  <text x="30" y="613" font-size="6" fill="#fff" font-weight="600">19. RPC Explorer (38 templates)</text>

  <!-- RIGHT COLUMN: Method Families -->
  <text x="610" y="60" font-size="9" fill="#475569" font-weight="700" letter-spacing="1">15 METHOD FAMILIES (74 RPC METHODS)</text>
  
  <rect x="580" y="68" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="85" font-size="9" fill="#334155" font-weight="600">system.*</text>
  <text x="780" y="85" font-size="8" fill="#64748b">capabilities, ping, version, stats</text>

  <rect x="580" y="100" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="117" font-size="9" fill="#334155" font-weight="600">query.*</text>
  <text x="780" y="117" font-size="8" fill="#64748b">execute, prepare, run</text>

  <rect x="580" y="132" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="149" font-size="9" fill="#334155" font-weight="600">schema.*</text>
  <text x="780" y="149" font-size="8" fill="#64748b">create, alter, drop, list, describe</text>

  <rect x="580" y="164" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="181" font-size="9" fill="#334155" font-weight="600">data.*</text>
  <text x="780" y="181" font-size="8" fill="#64748b">insert, select, update, delete</text>

  <rect x="580" y="196" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="213" font-size="9" fill="#334155" font-weight="600">cluster.*</text>
  <text x="780" y="213" font-size="8" fill="#64748b">join, remove, promote, shard, status (9)</text>

  <rect x="580" y="228" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="245" font-size="9" fill="#334155" font-weight="600">settings.*</text>
  <text x="780" y="245" font-size="8" fill="#64748b">get, set, list</text>

  <rect x="580" y="260" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="277" font-size="9" fill="#334155" font-weight="600">stats.*</text>
  <text x="780" y="277" font-size="8" fill="#64748b">runtime, connections, storage</text>

  <rect x="580" y="300" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="317" font-size="9" fill="#334155" font-weight="600">vector.*</text>
  <text x="780" y="317" font-size="8" fill="#64748b">search, insert, indexStatus</text>

  <rect x="580" y="332" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="349" font-size="9" fill="#334155" font-weight="600">dp.* / oblivious.*</text>
  <text x="780" y="349" font-size="8" fill="#64748b">aggregate, budget, audit, get/set</text>

  <rect x="580" y="364" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="381" font-size="9" fill="#334155" font-weight="600">forensic.*</text>
  <text x="780" y="381" font-size="8" fill="#64748b">verify, query, export</text>

  <rect x="580" y="396" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="413" font-size="9" fill="#334155" font-weight="600">view.*</text>
  <text x="780" y="413" font-size="8" fill="#64748b">create, refresh, status, explainDeps, drop</text>

  <rect x="580" y="428" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="445" font-size="9" fill="#334155" font-weight="600">merge.*</text>
  <text x="780" y="445" font-size="8" fill="#64748b">apply, register, simulate</text>

  <rect x="580" y="460" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="477" font-size="9" fill="#334155" font-weight="600">wasm.plan.*</text>
  <text x="780" y="477" font-size="8" fill="#64748b">compile, run</text>

  <rect x="580" y="492" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="509" font-size="9" fill="#334155" font-weight="600">advisor.* / migration.*</text>
  <text x="780" y="509" font-size="8" fill="#64748b">synthesize, history, analyze, report</text>

  <rect x="580" y="524" width="355" height="26" rx="5" fill="url(#gFam)" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="595" y="541" font-size="9" fill="#334155" font-weight="600">ai.*</text>
  <text x="780" y="541" font-size="8" fill="#64748b">nl.translate, nl.explain, nl.execute, autoparam</text>

  <!-- Connecting lines: Panels → Families -->
  <!-- Overview → system.*, stats.* -->
  <line x1="195" y1="81" x2="575" y2="81" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)" opacity=".5"/>
  <line x1="195" y1="81" x2="575" y2="273" stroke="#94a3b8" stroke-width="0.7" marker-end="url(#arr)" opacity=".3"/>
  <!-- Console → query.* -->
  <line x1="195" y1="113" x2="575" y2="113" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)" opacity=".5"/>
  <!-- Schema → schema.* -->
  <line x1="195" y1="145" x2="575" y2="145" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)" opacity=".5"/>
  <!-- Data → data.* -->
  <line x1="195" y1="177" x2="575" y2="177" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)" opacity=".5"/>
  <!-- Cluster → cluster.* -->
  <line x1="195" y1="209" x2="575" y2="209" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)" opacity=".5"/>
  <!-- Settings → settings.* -->
  <line x1="195" y1="241" x2="575" y2="241" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)" opacity=".5"/>
  <!-- Users → settings.* -->
  <line x1="195" y1="273" x2="575" y2="241" stroke="#94a3b8" stroke-width="0.7" marker-end="url(#arr)" opacity=".3"/>
  
  <!-- Import/Export → data.*, schema.* -->
  <line x1="195" y1="331" x2="575" y2="177" stroke="#d97706" stroke-width="0.7" marker-end="url(#arr)" opacity=".4"/>
  <line x1="195" y1="331" x2="575" y2="145" stroke="#d97706" stroke-width="0.7" marker-end="url(#arr)" opacity=".4"/>

  <!-- Research panels → families -->
  <!-- Vectors → vector.* -->
  <line x1="195" y1="421" x2="575" y2="313" stroke="#10b981" stroke-width="0.8" marker-end="url(#arr)" opacity=".4"/>
  <!-- Privacy → dp.*, oblivious.* -->
  <line x1="195" y1="453" x2="575" y2="345" stroke="#10b981" stroke-width="0.8" marker-end="url(#arr)" opacity=".4"/>
  <!-- Forensics → forensic.* -->
  <line x1="195" y1="485" x2="575" y2="377" stroke="#10b981" stroke-width="0.8" marker-end="url(#arr)" opacity=".4"/>
  <!-- Views → view.* -->
  <line x1="195" y1="517" x2="575" y2="409" stroke="#10b981" stroke-width="0.8" marker-end="url(#arr)" opacity=".4"/>

  <!-- RPC Explorer → all (dashed) -->
  <line x1="195" y1="609" x2="575" y2="81" stroke="#ef4444" stroke-width="0.5" stroke-dasharray="3,2" marker-end="url(#arr)" opacity=".25"/>
  <line x1="195" y1="609" x2="575" y2="541" stroke="#ef4444" stroke-width="0.5" stroke-dasharray="3,2" marker-end="url(#arr)" opacity=".25"/>

  <!-- Legend -->
  <rect x="280" y="580" width="400" height="30" rx="5" fill="#fff" stroke="#e2e8f0"/>
  <rect x="294" y="590" width="10" height="10" rx="2" fill="#6366f1"/>
  <text x="308" y="599" font-size="7" fill="#475569">General</text>
  <rect x="358" y="590" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="372" y="599" font-size="7" fill="#475569">Operations</text>
  <rect x="438" y="590" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="452" y="599" font-size="7" fill="#475569">Research</text>
  <rect x="508" y="590" width="10" height="10" rx="2" fill="#ef4444"/>
  <text x="522" y="599" font-size="7" fill="#475569">RPC Explorer (universal)</text>
  <line x1="608" y1="595" x2="628" y2="595" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <text x="634" y="599" font-size="7" fill="#475569">Panel → Family mapping</text>
</svg>
